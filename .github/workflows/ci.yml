name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      # The mail engine (NimbraCore) comes from its GitHub release: Xcode resolves the
      # package and downloads the prebuilt NimbraFFI.xcframework, so no Rust here.
      - uses: actions/checkout@v4
        with:
          path: ios
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen
      - name: Build and test
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[7-9][^(]*' | sed 's/ *$//')
          # Signed ad hoc (no team, no certificate), as Xcode signs a simulator build to run
          # locally: unsigned, the app has no Keychain access and the Keychain tests fail.
          xcodebuild -project Nimbra.xcodeproj -scheme Nimbra \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGN_IDENTITY=- test
