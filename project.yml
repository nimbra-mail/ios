# XcodeGen spec. Nimbra.xcodeproj is generated from this file and not committed:
# run `xcodegen` after cloning and after adding or moving files.
name: Nimbra
options:
  bundleIdPrefix: com.riangle
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# The mail engine (Rust, github.com/nimbra-mail/core): its Swift package at a release, which
# downloads the prebuilt NimbraFFI.xcframework from that release. Pinned exactly, like the
# Mac app's tag. To build against a local checkout in ../core instead, run
# `scripts/local-core.sh on` (a gitignored project.local.yml; see the README).
packages:
  NimbraCore:
    url: https://github.com/nimbra-mail/core
    exactVersion: 0.1.7
# The OAuth client ids (Config/OAuth.xcconfig, gitignored) through Config/Shared.xcconfig.
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Everything is main-actor isolated unless it says otherwise.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nimbra:
    type: application
    platform: iOS
    # A shared Nimbra scheme that also runs the unit tests (xcodebuild test).
    scheme:
      testTargets: [NimbraTests]
    sources:
      - path: Nimbra
        excludes: [Info.plist]
    dependencies:
      - package: NimbraCore
    settings:
      base:
        PRODUCT_NAME: Nimbra
        PRODUCT_BUNDLE_IDENTIFIER: com.riangle.nimbra
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Holds what INFOPLIST_KEY_* cannot (UIAppFonts, UILaunchScreen).
        INFOPLIST_FILE: Nimbra/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Nimbra
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Color sets become typed symbols: Color.textPrimary, Color.bgList…
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # Unit tests for the app's logic (Swift Testing), hosted by the app.
  NimbraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NimbraTests
    dependencies:
      - target: Nimbra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.riangle.nimbra.tests
